# Local development only. Collection creation belongs to the application.
name: knowledge-local
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
