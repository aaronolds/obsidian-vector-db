name: Bug report
description: Report a reproducible application or build problem.
body:
  - type: markdown
    attributes:
      value: |
        This is a public repository. Use synthetic notes and redacted diagnostics.
        Do not include real vault content, private queries, vectors, credentials,
        or identifying filesystem paths.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: What should have happened, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and a small synthetic note/config example if needed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, operating system, .NET SDK version, and Qdrant version if relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include exit codes or safe error messages, not real note/query content.
